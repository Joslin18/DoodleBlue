<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="register.html" class="active">Register</a></li>
        </ul>
    </nav>
</header>

<section class="register-section">
    <h1>Event Registration</h1>
    <p>Fill out the form below to register for your preferred event.</p>

    <form id="registerForm">
        <input type="text" id="name" placeholder="Full Name" required>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="tel" id="phone" placeholder="Phone Number" required>

        <input type="text" id="department" placeholder="Department" required>

        <select id="event" required>
            <option value="">Select Event</option>
            <option>Tech Fest 2026</option>
            <option>Cultural Day</option>
            <option>Inter-College Sports Meet</option>
            <option>AI Workshop</option>
            <option>Photography Contest</option>
            <option>Career Guidance Talk</option>
        </select>

        <textarea id="message" rows="5" placeholder="Additional Remarks"></textarea>

        <button type="submit">Register Now</button>
    </form>
</section>

<footer>
    <p>© 2026 Campus Events. All Rights Reserved.</p>

    <div class="social">
        <a href="#">
            <img src="images/facebook.png" alt="Facebook">
        </a>

        <a href="#">
            <img src="images/twitter.png" alt="Twitter">
        </a>

        <a href="#">
            <img src="images/instagram.png" alt="Instagram">
        </a>
    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
