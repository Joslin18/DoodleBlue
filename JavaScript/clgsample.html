<html lang = "en">
    <body>
        <button id="loadbtn">Load Users</button>
        <p id="status"></p>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Brand</th>
                </tr>
            </thead>
            <tbody id="userTable">
                </tbody>
        </table>
        <script>
            const loadbtn = document.getElementById("loadbtn");
            const userTable = document.getElementByID("userTable");
            const status = document.getElementByID("status");
            
            async function displayUsers(users){
                
                status.textContent = "Loading Users";
                loadbtn.disabled = true;
                userTable.innerHTML = "";

                try{
                    const response = await fetch("https://dummyjson.com/products");

                    if(!response.ok){
                        throw new Error("Failed to fetch the data");

                    }
                    
                    }
                    const users = await response.json();
                    users.products.forEach((product)=>{
                        const row = document.createElement("tr");

                        row.innerHTML=`
                        <td>${product.title}</td>
                        <td>${product.category}</td>
                        <td>${product.price}</td>
                        <td>${product.brand}</td>
                        `;
                        userTable.appendChild(row);
                    });

                    status.textContent = "Users Loaded Successfully";
                    const users = await response.json();
                    localStorage.setItem("users", JSON.stringify(users));
                    displayUsers(users);
                    status.textContent = "Users Loaded and saved Successfully";
                } catch (error){
                    status.textContent = "Error: " + error.message;
                    console.error(error);
                } finally{
                    loadbtn.disabled = false;       

            }
            function loadSavedUsers(){
                const savedUsers = localStorage.getItem("users");
                if(savedUsers){
                    displayUsers(JSON.parse(savedUsers));
                    status.textContent = "Loaded Users from Local Storage";
                }
                else{
                    status.textContent = "Click Load Users to fetch data";
                }
            }
            loadbtn.addEventListener("click", fetchUsers);
        </script>
    </body>
</html>
